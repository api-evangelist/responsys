aid: responsys
name: Responsys
description: >-
  Oracle Responsys (Oracle Responsys Campaign Management) is a B2C cross-channel
  marketing orchestration platform, originally founded as Responsys and acquired by
  Oracle in 2014, now part of Oracle Marketing. It lets marketing teams design and
  deliver targeted, personalized customer experiences across email, mobile push, SMS,
  MMS, web push, display, and web channels, unifying data from disparate sources into
  precisely targeted audiences delivered in near real-time. Responsys exposes a REST API
  (v1.3, published as a Swagger 2.0 document with 88 operations), an asynchronous AFTM
  API, an Event Notification webhook API covering 26 campaign event types, and a legacy
  SOAP API — managing profile lists and recipients, profile extension tables,
  supplemental tables, campaigns and schedules, programs, folders, the content library,
  triggered email/SMS/push messages, events, and account settings. This profile catalogs
  the public Oracle Responsys developer surface for the API Evangelist network.
