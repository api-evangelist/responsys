apis:
- name: Oracle Responsys REST API
  description: >-
    The Responsys REST API (v1.3) manages profile lists and recipients, profile
    extension tables, supplemental data tables, campaigns and campaign schedules,
    programs, folders, the content library, triggered email/SMS/push messages,
    events, filters, and account settings. Authentication is token-based via the
    auth/token endpoint; the returned token and pod endpoint are then used for
    subsequent calls.
