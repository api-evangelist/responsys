- name: Oracle Responsys Event Notification API
  description: >-
    The Event Notification API pushes real-time campaign event data to a customer-owned
    callback URL. Register a callback, verify it, then subscribe it to any of the 26
    supported event types across email, SMS, MMS, mobile push and web push — delivery
    failures, clicks, and opt-in/opt-out consent changes — delivered in configurable
    batches. It is the only feedback channel for a triggered send. Controlled
    Availability; access requires a My Oracle Support service request and the Events
    tier requires an additional SKU.
  humanURL: https://docs.oracle.com/en/cloud/saas/marketing/responsys-develop/API/REST/EventNotification/rest-event-notifications.htm
  baseURL: https://login5.responsys.net/rest/api/v1.3/notifications
  tags:
  - Webhooks
  - Events
  - Marketing
  properties:
  - type: Documentation
    url: https://docs.oracle.com/en/cloud/saas/marketing/responsys-develop/API/REST/EventNotification/rest-event-notifications.htm
  - type: Webhooks
    url: asyncapi/responsys-event-notification-webhooks.yml
- name: Oracle Responsys AFTM / Asynchronous API
  description: >-
    The AFTM (Automatic Failover for Transactional Messaging) REST API provides
    asynchronous, high-availability alternatives to the synchronous merge and trigger
    operations — HA Merge List Members, HA Merge Trigger Email (with and without
    attachments), HA Merge Trigger SMS, HA Trigger Push Message, and HA Retrieve List
    Members. Requests are queued and acknowledged immediately; a request carrying more
    than 200 recipients is rejected outright. Controlled Availability, and it requires
    an additional SKU.
  humanURL: https://docs.oracle.com/en/cloud/saas/marketing/responsys-develop/API/GetStarted/Overview/rest-aftm.htm
  baseURL: https://login5.responsys.net/rest/api/v1.3
