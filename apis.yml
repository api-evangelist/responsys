x-pointer-notes:
  omitted_deliberately:
  - type: MCPServer
    reason: >-
      Removed 2026-08-13. mcp/responsys-mcp.yml is a DERIVED candidate tool list with
      deployment.mode = none — no hosted endpoint, no stdio package, nothing an agent can
      reach. The pointer asserted an MCP server Oracle does not ship. The artifact stays;
      the pointer does not.
  - type: WellKnown
    reason: >-
      well-known/responsys-well-known.yml records an absence — every /.well-known/ path
      404s on docs.oracle.com, 403s on www.oracle.com, and the responsys.net API hosts
      refuse TCP 443 from the public internet.
  - type: AgentCard
    reason: No agent card served on any host; probed both /.well-known/agent-card.json and /.well-known/agent.json.
  - type: Idempotency
    reason: >-
      Responsys documents no idempotency key and no retry-safety contract. See
      conventions/responsys-conventions.yml.
  - type: StatusPage
    reason: >-
      No public Responsys status page. ocistatus.oraclecloud.com covers Oracle Cloud
      Infrastructure, a different service, and is not recorded as one.
  - type: Deprecation
    reason: No published deprecation policy and no RFC 8594 Sunset/Deprecation header support for the REST API.
  - type: Pricing
    reason: No pricing page — https://www.oracle.com/cx/marketing/campaign-management/pricing/ returns 404. Recorded as plan_count 0 in plans/.
x-coverage:
  state: covered
  note: >-
    Round 2 found the machine-readable contract round 1 missed — a genuine Swagger 2.0
    (63 paths, 88 operations) served at
    https://docs.oracle.com/en/cloud/saas/marketing/responsys-rest-api/swagger.json — plus
    a real webhook surface (Event Notification API, 26 event types). Two walls remain and
    are recorded rather than guessed: the Responsys API hosts refuse TCP 443 from the
    public internet, so nothing on them can be probed live; and docs.oracle.com serves a
    24,349-byte soft-404 shell with HTTP 200 for every missing path, so path probes there
    must be verified by body, never by status.
  checked: '2026-08-13'
