note: >-
  Oracle publishes no pricing for Responsys — no tiers, no list price, no per-message
  rate card. The product page routes to "Contact sales" / "Request a demo". API access
  itself is tiered by availability rather than by a purchasable plan: the Standard REST
  API and SOAP API are described as complimentary with a Responsys subscription, several
  APIs are "Controlled Availability" gated behind a My Oracle Support service request,
  and two (the Events API and the AFTM API) are documented as requiring an additional
  SKU whose price is not published.
