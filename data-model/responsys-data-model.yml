derivation_note: >-
  Derived from the harvested Swagger 2.0 (63 paths, 88 operations, 100 definitions). The
  spec's $ref graph is almost entirely collection-wrapper -> item (e.g. lists-collection
  has_many lists), so it carries little domain structure on its own; the real Responsys
  entity graph is expressed by PATH HIERARCHY (a profile extension lives under a list, a
  supplemental table lives under a folder) and by ID-REFERENCE FIELDS (riid, campaignId,
  customerId). Both are recorded below and each relationship names the evidence it came
  from. No relationship here was invented.
identity:
  primary_key: RIID
  primary_key_note: >-
    The Recipient ID (RIID) is the one opaque numeric identifier in the model. Nearly
    every other entity is addressed by a human-readable NAME in the path — listName,
    campaignName, programName, folderName, petName, tableName, docPath, itemPath — not by
    an id. This is unusual and it is load-bearing for an agent: renaming an object in the
    Responsys UI changes its API address.
  secondary_keys: [campaignId, customerId, scheduleId]
