definitions:
  triggerSmsMessage:
    title: Trigger SMS Message
    type: object
    properties:
      recipientData:
        description: Array of Recipients with Optional Data
        type: array
        items:
          type: object
          properties:
            recipient:
              type: object
              description: Information about the Recipient.
              properties:
                customerId:
                  type: string
                  description: Recipient's Customer ID.
                mobileNumber:
                  type: string
                  description: Recipient's Mobile Number.
                emailAddress:
                  type: string
                  description: Recipient's Email Address.
                emailMD5Hash:
                  type: string
                  description: Recipient's MD5 Email Hash Value.
                emailSHA256Hash:
                  type: string
                  description: Recipient's SHA256 Email Hash Value.
                listName:
                  type: object
                  description: Profile List to which the Recipient belongs.
                  properties:
                    folderName:
                      type: string
                      description: Folder Name
                    objectName:
                      type: string
                      description: Profile List Name.
                recipientId:
                  type: number
                  description: Recipient's RIID.
              required:
              - customerId
              - emailAddress
              - listName
              - recipientId
              - mobileNumber
            optionalData:
              type: array
              description: Array of optional data containing name value pairs.
              items:
                type: object
                properties:
                  name:
                    type: string
                  value:
                    type: string
          required:
          - recipient
          - optionalData
    required:
    - recipientData
  triggerSms-response:
    title: Trigger SMS Response
    type: array
    description: Array of Recipient Results.
    items:
      type: object
      description: Response for individual recipient.
      properties:
        errorMessage:
          type: string
          description: Error Message, if any, that occurred during the trigger operation.
        success:
          type: boolean
          description: Indicates success or failure.
        recipientId:
          type: number
          description: The Responsys ID (RIID) of the recipient.
  userInfo:
    title: User Information
    type: object
    properties:
      accountName:
        description: Account name.
        type: string
      userName:
        description: Username.
        type: string
      userEmail:
        description: Email Address of the user.
        type: string
      userLocale:
        description: Locale of the user.
        type: string
      accountDisplayName:
        description: Account display name.
