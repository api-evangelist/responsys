availability_tiers:
  source: https://docs.oracle.com/en/cloud/saas/marketing/responsys-user/API.htm
  note: >-
    Responsys gates APIs by availability rather than by version lifecycle. Standard REST
    is generally available; Advanced, SOAP, Asynchronous, Asynchronous Reporting, Events
    and AFTM are all Controlled Availability, reached by raising a My Oracle Support
    service request (and, for Events and AFTM, buying an additional SKU).
