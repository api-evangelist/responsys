note: >-
  Oracle publishes NO first-party server-side client library (no npm/PyPI/Maven/NuGet
  package) for the Responsys REST API v1.3 — integrators call the REST surface directly.
  The first-party packages Oracle does ship are all for the Responsys Mobile App Platform
  (the PushIOManager SDK) and its cross-platform wrappers. The two Python "Responsys"
  libraries on PyPI are community projects, both long abandoned.
